<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Hotel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select { padding: 8px; width: 250px; }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h2>Automação de Reserva de Hotel</h2>
    <form action="processa.php" method="POST">
        <div class="form-group">
            <label for="nome">Nome do Hóspede:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="quarto">Tipo de Quarto:</label>
            <select id="quarto" name="quarto" required>
                <option value="Standard">Standard (R$ 150,00/dia)</option>
                <option value="Suite">Suíte (R$ 230,00/dia)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="diarias">Quantidade de Diárias:</label>
            <input type="number" id="diarias" name="diarias" min="1" required>
        </div>

        <div class="form-group">
            <label for="cafe">Deseja Café da Manhã?</label>
            <select id="cafe" name="cafe" required>
                <option value="Sim">Sim (R$ 25,00/dia)</option>
                <option value="Não">Não</option>
            </select>
        </div>

        <button type="submit">Calcular Reserva</button>
    </form>
</body>
</html>
